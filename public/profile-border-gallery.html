<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gin Rummy Profile Border Gallery</title>
  <link rel="stylesheet" href="/theme-angel.css">
  <style id="galleryStyles">
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 24px 56px;
      overflow-x: hidden;
      color: #f8f5ff;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(111,103,176,.24), transparent 42%),
        linear-gradient(160deg, #10152a, #171a35 48%, #0b1022);
    }
    .gallery-shell { width: min(1180px, 100%); margin: 0 auto; }
    .gallery-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .gallery-head h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .gallery-head p { margin: 7px 0 0; color: rgba(238,240,255,.56); font-size: 13px; }
    .gallery-count { color: #ffe09a; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .border-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .border-sample {
      min-width: 0;
      padding: 18px;
      border: 1px solid rgba(220,225,255,.1);
      border-radius: 8px;
      background: rgba(13,18,40,.72);
    }
    .sample-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .sample-name { font-size: 15px; font-weight: 900; }
    .sample-rarity { color: rgba(232,234,255,.48); font-size: 10px; font-weight: 700; }
    .sample-profile.avatar-card {
      width: 100%;
      min-height: 86px;
      padding: 12px 15px;
      background: linear-gradient(145deg, rgba(28,38,69,.98), rgba(12,20,42,.98));
    }
    .sample-profile .avatar-emoji { width: 54px; height: 54px; display: grid; place-items: center; font-size: 34px; }
    .sample-profile .avatar-name { font-size: 14px; }
    .sample-profile .avatar-subline { display: flex; margin-top: 4px; color: rgba(228,233,255,.52); }
    .sample-unlock { margin-top: 12px; color: rgba(232,234,255,.52); font-size: 11px; line-height: 1.4; }
    .sample-id { color: rgba(255,224,154,.72); font-family: Consolas, monospace; font-size: 10px; }
    .fx-check { display: flex; gap: 8px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(220,225,255,.1); }
    .fx-check button { min-height: 38px; padding: 0 14px; border: 1px solid rgba(255,224,154,.35); border-radius: 6px; color: #fff8dd; background: rgba(255,224,154,.1); cursor: pointer; }
    @media (max-width: 850px) { .border-gallery { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 540px) { body { padding: 24px 14px 40px; } .border-gallery { grid-template-columns: 1fr; } .gallery-head { align-items: start; flex-direction: column; } }
  </style>
</head>
<body class="theme-angel">
  <main class="gallery-shell">
    <header class="gallery-head">
      <div>
        <h1>프로필 테두리 현황</h1>
        <p>실제 게임의 avatar-card와 avatar-emoji 클래스를 사용한 현재 디자인</p>
      </div>
      <div class="gallery-count">총 11종</div>
    </header>
    <section class="border-gallery" id="borderGallery"></section>
    <div class="fx-check" aria-label="축복 효과 가장자리 테스트">
      <button type="button" data-fx-x="24px">왼쪽 광휘 테스트</button>
      <button type="button" data-fx-x="50%">중앙 광휘 테스트</button>
      <button type="button" data-fx-x="calc(100% - 24px)">오른쪽 광휘 테스트</button>
    </div>
  </main>
  <script>
    const borders = [
      ['green','그린','일반','기본 테두리 · 항상 사용 가능'],
      ['bronze','브론즈','일반','항상 사용 가능'],
      ['silver','실버','일반','랭킹 500 RP 달성'],
      ['w5','스틸','일반','PVP 5승 달성'],
      ['gold','골드','고급','랭킹 1000 RP 달성'],
      ['w20','에메랄드','고급','PVP 20승 달성'],
      ['platinum','플래티넘','희귀','랭킹 2000 RP 달성'],
      ['diamond','다이아','희귀','랭킹 3500 RP 달성'],
      ['w50','루비','희귀','PVP 50승 달성'],
      ['challenger','챌린저','전설','랭킹 6000 RP 달성'],
      ['w100','레전드','전설','PVP 100승 달성']
    ];

    async function loadGameStyles() {
      const source = await fetch('/index.html').then(response => response.text());
      const parsed = new DOMParser().parseFromString(source, 'text/html');
      const gameStyles = document.createElement('style');
      gameStyles.textContent = Array.from(parsed.querySelectorAll('style'), style => style.textContent).join('\n');
      document.head.insertBefore(gameStyles, document.getElementById('galleryStyles'));
    }

    function renderGallery() {
      document.getElementById('borderGallery').innerHTML = borders.map(([id,name,rarity,unlock]) => `
        <article class="border-sample">
          <div class="sample-meta"><span class="sample-name">${name}</span><span class="sample-rarity">${rarity}</span></div>
          <div class="avatar-card cb-${id} sample-profile">
            <div class="avatar-emoji cb-${id}">🐢</div>
            <div class="avatar-info">
              <div class="avatar-name">수박복</div>
              <div class="avatar-subline"><span>gyupaca · 257 RP</span></div>
            </div>
          </div>
          <div class="sample-unlock"><span class="sample-id">cb-${id}</span> · ${unlock}</div>
        </article>`).join('');
    }

    function showBlessing(xValue) {
      document.querySelector('.angel-blessing-wave')?.remove();
      const wave = document.createElement('div');
      wave.className = 'angel-blessing-wave';
      wave.style.setProperty('--blessing-x', xValue);
      wave.style.setProperty('--blessing-y', '82%');
      document.body.appendChild(wave);
      setTimeout(() => wave.remove(), 3400);
    }

    loadGameStyles().then(renderGallery);
    document.querySelectorAll('[data-fx-x]').forEach(button => button.addEventListener('click', () => showBlessing(button.dataset.fxX)));
  </script>
</body>
</html>
