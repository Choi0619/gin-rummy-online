<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gin Rummy UI Polish Preview</title>
  <link rel="stylesheet" href="/character-art.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 24px 60px;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% -10%,#55577c 0,#232743 38%,#0c1122 100%)}
    main{width:min(1120px,100%);margin:auto}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.head h1{margin:0;font-size:26px}.head p{margin:5px 0 0;color:#aeb7d2;font-size:13px}.chip{padding:7px 11px;border:1px solid #7f8baa;border-radius:999px;color:#dce4ff;font-size:11px}
    section{margin-top:18px;padding:20px;border:1px solid #414b70;border-radius:8px;background:rgba(15,20,42,.82)}h2{margin:0 0 16px;font-size:16px;letter-spacing:0}
    .character-grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:10px}.character-option{aspect-ratio:1;display:grid;place-items:center;position:relative;border:1px solid #596486;border-radius:8px;background:#292f50;font-size:48px}.character-option.selected{border:2px solid #f7d27b;background:linear-gradient(145deg,#45445f,#282c49);box-shadow:0 0 18px rgba(255,220,130,.22)}.character-option small{position:absolute;left:0;right:0;bottom:7px;color:#b9c2dd;font-size:10px;text-align:center}.character-option .char-art,.character-option .char-art-img{margin-top:-5px}
    .fit-row{display:flex;flex-wrap:wrap;gap:14px}.fit-avatar{width:68px;height:68px;display:grid;place-items:center;border:2px solid #dbe8ff;border-radius:50%;background:radial-gradient(circle at 35% 28%,#4c5875,#10182c 72%);font-size:54px;box-shadow:0 0 0 4px rgba(150,210,255,.12),0 0 15px rgba(94,203,255,.32)}.fit-avatar>.char-art,.fit-avatar>.char-art-img{display:block;margin:auto}
    .status-demo{min-height:42px;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,229,168,.38);border-radius:9px;color:#fff4d5;background:linear-gradient(145deg,rgba(93,85,128,.72),rgba(28,32,70,.88));font-size:13px;font-weight:700;line-height:1.35;text-align:center}.spinner{display:inline-block;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.effect-cell{min-height:260px;padding:18px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #353f62;border-radius:8px;background:radial-gradient(circle at 50% 55%,#303653,#11172c 66%)}.effect-label{position:absolute;left:14px;top:12px;z-index:20;padding:5px 9px;border-radius:999px;background:rgba(5,8,18,.72);color:#dce3f8;font-size:11px;font-weight:700}
    .profile-card{width:min(360px,88%);height:84px;display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;isolation:isolate;overflow:visible;border:2px solid #f3d26b;border-radius:12px;background:linear-gradient(145deg,#472a18,#180f18);box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 14px rgba(255,184,42,.3);z-index:2}.avatar{width:54px;height:54px;display:grid;place-items:center;flex:none;border:2px solid #ffce72;border-radius:50%;background:#1b2038;font-size:43px;position:relative;z-index:3}.avatar>.char-art{display:block;margin:auto}.copy{min-width:0;position:relative;z-index:3}.name{font-size:15px;font-weight:800}.meta{margin-top:5px;color:#ddc8ae;font-size:10px;font-weight:700}
    .old-fire{position:absolute;inset:-18px;border-radius:26px;pointer-events:none;z-index:-1}.old-fire .base{position:absolute;left:2%;right:2%;bottom:-6px;height:58px;border-radius:22px;background:radial-gradient(ellipse at 50% 100%,rgba(255,150,20,.85),rgba(255,90,0,.55) 45%,rgba(255,60,0,.2) 75%,transparent 92%);filter:blur(10px);animation:oldGlow 1s ease-in-out infinite}.old-flame{position:absolute;bottom:-4px;border-radius:50% 50% 40% 40%/65% 65% 35% 35%;filter:blur(6px);mix-blend-mode:screen;transform-origin:50% 100%;background:linear-gradient(180deg,rgba(255,240,190,0),rgba(255,210,110,.6) 25%,rgba(255,140,20,.88) 58%,rgba(255,70,0,.92));animation:oldFlicker .85s ease-in-out infinite}@keyframes oldGlow{50%{opacity:.76}}@keyframes oldFlicker{0%,100%{transform:scaleX(.82) scaleY(.86) rotate(-3deg);opacity:.72}50%{transform:translateY(-8px) scaleX(1.08) scaleY(1.1) rotate(4deg);opacity:1}}
    .rendered-fire{position:absolute;inset:-36px -24px -21px;overflow:visible;pointer-events:none;z-index:-2;isolation:isolate}.rendered-fire i{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:100% 100%;mix-blend-mode:screen;filter:hue-rotate(-9deg) saturate(1.08) brightness(.9);will-change:opacity}.rendered-fire .fire-a{background-image:url('/assets/effects/revenge-fire-frame-a.webp?v=1');animation:fireFlickerA .72s steps(4,end) infinite}.rendered-fire .fire-b{background-image:url('/assets/effects/revenge-fire-frame-b.webp?v=1');animation:fireFlickerB .91s steps(5,end) infinite}.rendered-fire .fire-c{background-image:url('/assets/effects/revenge-fire-frame-c.webp?v=1');animation:fireFlickerC 1.13s steps(5,end) infinite}.new-aura{position:absolute;inset:-8px;z-index:-1;border-radius:18px;background:radial-gradient(ellipse at 50% 32%,rgba(255,196,96,.16),transparent 70%),radial-gradient(ellipse at 50% 108%,rgba(255,105,30,.12),transparent 72%);opacity:.34;animation:auraPulse 1.7s ease-in-out infinite}@keyframes fireFlickerA{0%,100%{opacity:.28}22%{opacity:.39}47%{opacity:.24}71%{opacity:.35}}@keyframes fireFlickerB{0%,100%{opacity:.2}18%{opacity:.11}43%{opacity:.26}68%{opacity:.14}84%{opacity:.23}}@keyframes fireFlickerC{0%,100%{opacity:.1}27%{opacity:.2}54%{opacity:.12}78%{opacity:.24}}@keyframes auraPulse{50%{opacity:.5}}
    @media(max-width:760px){body{padding:20px 12px 40px}.character-grid{grid-template-columns:repeat(4,1fr)}.compare{grid-template-columns:1fr}.effect-cell{min-height:230px}.head{align-items:start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){.spinner,.old-fire *,.rendered-fire i,.new-aura{animation:none!important}.rendered-fire .fire-a{opacity:.32}.rendered-fire .fire-b,.rendered-fire .fire-c{display:none}}
  </style>
</head>
<body>
<main>
  <header class="head"><div><h1>캐릭터 · 리벤지 UI 점검</h1><p>실제 게임 에셋과 프로필 비율을 사용한 비교 화면</p></div><span class="chip">GPU 합성형 시안</span></header>
  <section><h2>프로필 캐릭터 선택</h2><div class="character-grid" id="characterGrid"></div></section>
  <section><h2>원형 프로필 맞춤</h2><div class="fit-row" id="fitRow"></div></section>
  <section><h2>리벤지 수락 대기</h2><div class="status-demo"><span class="spinner">⌛</span><span>딸기빙수의 리벤지 수락을 기다리는 중...</span></div></section>
  <section><h2>리벤지 프로필 효과 비교</h2><div class="compare">
    <div class="effect-cell"><span class="effect-label">현재 효과</span><div class="profile-card"><div class="old-fire" id="oldFire"><i class="base"></i></div><div class="avatar"><span class="char-art char-fox"></span></div><div class="copy"><div class="name">딸기빙수</div><div class="meta">DdalgiBingsoo · 리벤지 전</div></div></div></div>
    <div class="effect-cell"><span class="effect-label">AI 렌더링 불꽃 시안</span><div class="profile-card"><div class="rendered-fire"><i class="fire-a"></i><i class="fire-b"></i><i class="fire-c"></i></div><div class="new-aura"></div><div class="avatar"><span class="char-art char-unicorn"></span></div><div class="copy"><div class="name">수박복 (나)</div><div class="meta">gyupaca · 복수의 불꽃</div></div></div></div>
  </div></section>
</main>
<script>
  const characters=[['cat','고양이'],['dog','강아지'],['rabbit','토끼'],['fox','여우'],['bear','곰'],['panda','판다'],['koala','코알라'],['tiger','호랑이'],['turtle','거북이'],['lion','사자'],['frog','개구리'],['unicorn','유니콘']];
  const art=(id)=>id==='turtle'?'<img class="char-art-img" src="/turtle.png" alt="거북이">':`<span class="char-art char-${id}"></span>`;
  characterGrid.innerHTML=characters.map(([id,name],i)=>`<div class="character-option${i===11?' selected':''}">${art(id)}<small>${name}</small></div>`).join('');
  fitRow.innerHTML=characters.map(([id,name])=>`<div class="fit-avatar" title="${name}">${art(id)}</div>`).join('');
  for(let i=0;i<11;i++){const f=document.createElement('i');f.className='old-flame';f.style.left=`${3+i*9.3}%`;f.style.width=`${18+(i%3)*5}px`;f.style.height=`${40+(i%4)*8}px`;f.style.animationDelay=`${-i*.11}s`;oldFire.appendChild(f)}
</script>
</body>
</html>
