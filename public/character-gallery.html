<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gin Rummy Character Gallery</title>
  <link rel="preload" href="/assets/characters/animal-atlas-v1.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="/character-art.css">
  <style>
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:36px 22px 54px; color:#f7f8ff; font-family:"Segoe UI","Noto Sans KR",sans-serif; background:linear-gradient(150deg,#10172a,#18223b 55%,#0a1020); }
    main { width:min(1040px,100%); margin:auto; }
    header { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:24px; }
    h1 { margin:0; font-size:26px; letter-spacing:0; }
    header p { margin:7px 0 0; color:rgba(235,239,255,.58); font-size:13px; }
    .count { color:#c7f36a; font-size:13px; font-weight:800; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .item { min-width:0; padding:18px 14px 15px; text-align:center; border:1px solid rgba(225,233,255,.12); border-radius:8px; background:rgba(29,39,68,.76); }
    .portrait { display:grid; place-items:center; width:104px; height:104px; margin:0 auto 11px; font-size:94px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,.025) 67%,transparent 69%); }
    .name { display:block; font-size:15px; font-weight:800; }
    .unlock { display:block; min-height:16px; margin-top:4px; color:rgba(231,236,255,.52); font-size:10px; }
    .item.turtle { border-color:rgba(199,243,106,.38); box-shadow:inset 0 0 0 1px rgba(199,243,106,.08); }
    .item.turtle .unlock { color:#c7f36a; }
    @media(max-width:760px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
    @media(max-width:520px){ body{padding:26px 14px 40px;} header{align-items:start;flex-direction:column;} .grid{grid-template-columns:repeat(2,minmax(0,1fr));} .portrait{width:92px;height:92px;font-size:82px;} }
  </style>
</head>
<body>
  <main>
    <header><div><h1>캐릭터 갤러리</h1><p>기존 거북이와 같은 그림체로 통일한 실제 게임용 캐릭터</p></div><span class="count">총 12종</span></header>
    <section class="grid">
      <article class="item"><span class="portrait"><span class="char-art char-cat"></span></span><span class="name">고양이</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-dog"></span></span><span class="name">강아지</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-rabbit"></span></span><span class="name">토끼</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-fox"></span></span><span class="name">여우</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-bear"></span></span><span class="name">곰</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-panda"></span></span><span class="name">판다</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-koala"></span></span><span class="name">코알라</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-tiger"></span></span><span class="name">호랑이</span><span class="unlock">기본 캐릭터</span></article>
      <article class="item turtle"><span class="portrait"><img class="char-art-img" src="/turtle.png" alt="거북이"></span><span class="name">거북이</span><span class="unlock">기존 원본 유지 · PVP 3승</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-lion"></span></span><span class="name">사자</span><span class="unlock">PVP 7승</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-frog"></span></span><span class="name">개구리</span><span class="unlock">PVP 15승</span></article>
      <article class="item"><span class="portrait"><span class="char-art char-unicorn"></span></span><span class="name">유니콘</span><span class="unlock">PVP 30승</span></article>
    </section>
  </main>
</body>
</html>
