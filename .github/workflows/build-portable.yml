name: Build portable Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build portable executable
        run: npm run desktop:build-portable

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $portable = "release/GinRummy-Portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "src-tauri/target/release/gin-rummy-desktop.exe" "$portable/GinRummy.exe"
          @"
          Gin Rummy Online - Portable Windows Edition

          1. Run GinRummy.exe. No installation is required.
          2. An internet connection is required to reach the multiplayer server.
          3. Windows 10/11 normally includes the required WebView2 runtime.
          4. This unsigned beta may show a Windows SmartScreen warning.

          Website: https://gin-rummy-online.onrender.com
          "@ | Set-Content -Encoding UTF8 "$portable/README.txt"
          Compress-Archive -Path "$portable/*" -DestinationPath "release/GinRummy-Portable.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GinRummy-Portable-Windows-x64
          path: release/GinRummy-Portable.zip
          if-no-files-found: error
          retention-days: 30
